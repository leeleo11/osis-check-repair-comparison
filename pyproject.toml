[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "osis-check-repair-comparison"
version = "0.1.0"
description = "Reproducible six-framework comparison for OSIS check-repair tasks"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
t2 = ["langchain>=1.3,<2", "langgraph>=1.2,<2"]
t3 = ["smolagents>=1.26,<2", "openai>=2,<3"]
t4 = ["openhands-sdk>=1.44,<2"]
t5 = ["crewai>=1.15,<2"]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["check_repair", "common", "baselines"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
